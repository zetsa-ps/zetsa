syntax = "proto2";
package cs;

option go_package = "GmServer/bridge/csproto;csproto";

import "ExOptions.proto";
import "WorldMap.proto";

enum TaskType {
    TT_MAIN = 1;
    TT_BRANCH = 2;
    TT_GUIDE = 3;
    TT_ACTIVITY = 4;
    TT_DAILY_RANDOM = 7;
    TT_JOURNEY = 9;
}
enum TaskNodeCollectType {
    TNCT_ALL = 0;
    TNCT_SOME = 1;
}
enum TaskNodeType {
    TNT_START = 10;
    TNT_ACTION = 20;
    TNT_CONDITION = 30;
    TNT_START_CONDITION = 31;
    TNT_FAIL_CONDITION = 32;
    TNT_COLLECT = 33;
    TNT_BRANCH = 34;
    TNT_END = 50;
    TNT_JUMP = 60;
}
enum TaskNodeSubType {
    TNST_TASK = 3010;
    TNST_LEVEL = 3020;
    TNST_HAS_ITEM = 2030;
}
enum TaskItemDefine {
    TID_MAX_NUM = 99;
}
enum TaskExternType {
    TTT_ACTIVITY = 1;
}
message TaskNode {
    repeated uint32 node_values = 1;
    optional uint32 node_id = 2;
    optional bool client_before = 3;
    repeated bool client_cond_after = 4;
}
message Task {
    optional uint32 task_id = 1;
    repeated TaskNode nodes = 2;
    repeated uint32 finish_nodes = 3;
    optional bool client_trace = 5;
    repeated uint32 reward_nodes = 6;
    repeated WorldObj objs = 7;
    optional uint32 start_time = 8;
    repeated uint32 extern_params = 9;
    optional uint32 final_time = 10;
}
message TaskRecord {
    optional uint32 task_id = 1;
    optional uint32 count = 2;
    optional uint32 time = 3;
}
message TaskItem {
    optional uint32 item_id = 1;
    optional uint32 item_num = 2;
}
message SCTaskSync {
    repeated Task tasks = 1;
    repeated uint32 del_tasks = 2;
    repeated TaskRecord task_records = 3;
    optional uint32 trace_id = 4;
    repeated TaskItem task_items = 5;
    repeated uint32 del_task_items = 6;
    repeated uint32 del_task_records = 7;
    repeated uint32 trace_list = 8;
    repeated uint32 del_trace_list = 9;
    optional uint32 next_main_id = 10;
    repeated uint32 journey_rewards = 11;
    repeated uint32 new_task_ids = 12;
}
message SCTaskRandomAreaSync {
    optional uint32 time = 1;
    repeated uint32 areas_ids = 2;
    repeated uint32 task_ids = 3;
}
message SCTaskJourneyTypeUnlock {
    optional uint32 sub_type = 1;
}
message CSTaskJourneyReward {
    optional uint32 sub_type = 1;
}
message TaskSubmitItem {
    optional uint32 item_id = 1;
    optional uint32 item_type = 2;
    optional uint32 item_count = 3;
    optional uint64 item_guid = 4;
}
message CSTaskSubmitItem {
    optional uint32 task_id = 1;
    optional uint32 node_id = 2;
    optional uint32 node_index = 3;
    repeated TaskSubmitItem items = 4;
}
message CSTaskRewardNode {
    optional uint32 task_id = 1;
    optional uint32 node_id = 2;
}
message CSTaskTrace {
    optional uint32 task_id = 1;
    optional bool is_trace = 2;
}
message CSTaskClientBefore {
    optional uint32 task_id = 1;
    optional uint32 node_id = 2;
}
message CSTaskClientAfter {
    optional uint32 task_id = 1;
    optional uint32 node_id = 2;
}
message CSTaskClientCondAfter {
    optional uint32 task_id = 1;
    optional uint32 node_id = 2;
    repeated uint32 indexes = 3;
}
message CSNotifyTaskEndNode {
    optional uint32 task_id = 1;
}
message TaskClientParam {
    optional uint32 task_id = 1;
    optional uint32 node_id = 2;
    repeated uint32 indexes = 3;
}
message CSTaskClientParam {
    repeated TaskClientParam task_params = 1;
}
message ClientCond {
    optional uint32 cond_id = 1;
    repeated uint32 cond_param_list = 2;
}
message CSClientCond {
    repeated ClientCond cond_list = 1;
}
