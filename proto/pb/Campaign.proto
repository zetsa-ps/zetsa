}
message SCMultiCampaignInfoSync {
    repeated MultiCampaignInfo camp = 1;
}
message MatchTeamHeroData {
    optional uint32 hero_id = 1;
    optional uint32 pet_id = 2;
    optional uint32 pet_special_type = 3;
    optional uint32 color = 4;
}
message TeamMemberAttr {
    optional uint32 player_id = 1;
    optional uint32 hp = 2;
    optional uint32 max_hp = 3;
    optional uint32 sp = 4;
    optional uint32 max_sp = 5;
}
message TeamAttrSync {
    repeated TeamMemberAttr attr = 1;
}
message TeamMemberPetDuel {
    optional uint32 id = 1;
    optional uint32 level = 2;
    optional uint32 speccial = 3;
}
message TeamMemberPetDuelGroup {
    optional uint32 hero_id = 1;
    repeated TeamMemberPetDuel pet_infos = 2;
    repeated UnitSkillInfo skills = 3;
}
message MatchTeamMemberData {
    optional uint32 pid = 1;
    optional string name = 3;
    optional uint32 lv = 4;
    optional uint32 control_hero = 5;
    repeated MatchTeamHeroData heros = 6;
    optional uint32 ui_status = 7;
    optional uint64 ts = 8;
    optional TeamMemberAttr attr = 9;
    optional uint32 ping = 10;
