}
message MatchTeamData {
    optional uint32 team_id = 1;
    optional uint32 dungeon_id = 2;
    optional uint32 captain = 3;
    repeated MatchTeamMemberData members = 4;
    optional uint32 match_start_time = 5;
    repeated uint32 ready_players = 6;
    optional uint64 dungeon_end_time = 7;
    optional uint32 scene_type = 8;
    optional MatchTeamLimitData limit = 9;
    repeated uint32 online_players = 10;
    optional uint32 site_id = 11;
}
message CSSyncMatchTeamData {
    optional MatchTeamData team = 1;
    optional uint32 reason = 2;
}
message MatchTeamInviteData {
    optional uint32 pid = 1;
