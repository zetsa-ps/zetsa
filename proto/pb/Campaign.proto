    optional uint32 box_id = 1;
    optional uint32 times = 2;
}
message SCStaminaReward {
    optional Rewards reward = 1;
    optional Rewards extra_reward = 2;
}
message MultiCampaignInfo {
    optional uint32 dungeon_id = 1;
    optional MultiCampaignStatus status = 2;
    optional uint32 start_time = 3;
    optional uint32 end_time = 4;
    optional uint32 star = 6;
    optional uint32 score = 7;
    optional uint32 dungeon_scene_id = 8;
    optional uint32 enable_end_time = 9;
    optional uint32 map_id = 10;
    optional uint32 line_id = 11;
    optional uint32 timeline_time = 12;
}
