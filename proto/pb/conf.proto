syntax = "proto2";
package conf;


message PromethusConf {
    optional bool enable = 1;
    optional string url = 2;
    optional uint32 interval = 4;
    optional bool thread = 5;
    optional string user = 6;
    optional string pwd = 7;
    optional bool sync = 8;
}
message HttpServerConf {
    optional uint32 port = 1;
    optional uint32 pool_size = 2;
    optional uint32 time_out = 3;
    optional uint32 sleep_time = 4;
    optional string sign_key_name = 5;
    optional string sign_key_secret = 6;
    optional bool enable = 7;
}
message ServerConfig {
    optional PromethusConf metrics = 1;
    optional HttpServerConf gm = 2;
}
message SvrZooData {
    optional bool disable = 1;
    optional string version = 2;
    optional uint64 version_no = 3;
}
