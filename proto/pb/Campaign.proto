    optional uint32 position = 2;
    optional bool is_quit = 3;
}
message CSReplyInviteJoinMatchTeam {
    optional bool is_accept = 1;
    optional uint64 team_id = 2;
}
message CSRejectInviteJoinMatchTeam {
    optional uint32 pid = 1;
    optional string name = 2;
}
message CSKickOutMatchTeam {
    optional uint32 pid = 1;
}
message CSMatchedReady {
    optional bool is_ready = 1;
}
message MatchedTeamMemberData {
    optional uint32 pid = 1;
    optional bool ready = 2;
}
message CSSyncMatchedReady {
    repeated MatchedTeamMemberData members = 1;
    optional uint32 matched_time = 2;
}
message SvrMatchTeamReq {
    optional uint32 option_id = 1;
    optional uint32 pid = 2;
    optional MatchTeamInviteData invite = 3;
    optional uint32 time = 4;
    optional bool ready = 5;
    repeated MatchTeamMemberData member_data = 6;
    optional CSSyncMatchTeamData team_data = 7;
    optional uint32 transfer_msg_id = 8;
    optional string transfer_data = 9;
}
message SvrMatchTeamRsp {
    optional uint32 errcode = 1;
}
message SvrStartMatchReq {
    optional MatchTeamData team = 1;
}
message SvrStopMatchReq {
    optional uint32 dungeon_id = 1;
    optional uint32 team_id = 2;
}
message SvrWorldMapReq {
    optional uint32 creator_id = 1;
    optional uint32 dungeon_id = 2;
}
message SvrWorldMapRsp {
    optional uint32 errcode = 1;
}
message ChangeDungeonStatus {
    optional uint32 result = 1;
