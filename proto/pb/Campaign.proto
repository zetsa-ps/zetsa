syntax = "proto2";
package cs;

option go_package = "GmServer/bridge/csproto;csproto";

import "CommonMsg.proto";
import "ExOptions.proto";
import "WorldMap.proto";
import "Pet.proto";

enum CampaignStatusType {
    CST_NONE = 0;
    CST_QUIT = 1;
    CST_START = 2;
    CST_WIN = 3;
    CST_LOSE = 4;
    CST_FINISH_QUIT = 5;
    CST_LOSE_QUIT = 6;
}
enum ActType {
    EAT_NONE = 0;
    EAT_LOSE = 1;
    EAT_WIN = 2;
    EAT_QUIT = 3;
}
enum CampaignSceneStatusType {
    CSST_NORMAL = 0;
    CSST_FINISH = 1;
}
enum CampaignType {
    CT_SCENE = 1;
    CT_BATTLE = 2;
}
enum CampaignChooseType {
    CCT_WORLD = 1;
    CCT_CHOOSE = 2;
}
enum TeamApplySrc {
    TAS_NONE = 0;
    TAS_Invite = 1;
    TAS_Chat = 2;
    TAS_Team_Platform = 3;
}
enum StaminaBoxSystemType {
    SBST_CAMPAIGN = 1;
    SBST_BATTLE_CAMPAIGN = 2;
    SBST_WORLD_ENEMY = 3;
    SBST_MULTI_CAMPAIGN = 4;
}
enum StaminaBoxCountType {
    SBCT_INFINITE = 1;
    SBCT_DAILY = 2;
    SBCT_WEEKLY = 3;
}
enum BaseMaterialDungeonGroupId {
    HeroExpDungeon = 11;
    SoulEssenceExpDungeon = 12;
    PetExpDungeon = 13;
    GoldDungeon = 20;
}
enum EntrustType {
    ET_NONE = 0;
    ET_Dungeon = 1;
    ET_Kibo = 5;
}
enum MultiCampaignStatus {
    MCST_NONE = 0;
    MCST_QUIT = 1;
    MCST_READY = 2;
    MCST_START = 3;
    MCST_WIN = 4;
    MCST_LOSE = 5;
    MCST_FINISH_QUIT = 6;
}
enum CampaignExpandType {
    CET_ROGUE_BOX = 1;
}
enum CMemOnlineStatus {
    CMOS_ONLINE = 0;
    CMOS_OFFLINE = 1;
}
enum MatchTeamOptionType {
    CREATE_TEAM = 1;
    LEAVE_TEAM = 2;
    KICKOUT_TEAM = 3;
    INVITE_TEAM = 4;
    CANCEL_INVITE_TEAM = 5;
    ACCEPT_INVITE = 6;
    REJECT_INVITE = 7;
    START_MATCH = 8;
    STOP_MATCH = 9;
    READY_MATCH = 10;
    UNREADY_MATCH = 11;
    DESTROY_TEAM = 12;
    SYNC_DATA = 13;
    TRANS_PROTO = 14;
    CHANGE_CAPTAIN = 15;
}
enum MatchTeamDataSyncReason {
    MTDSR_NONE = 0;
    MTDSR_LOGIN = 1;
}
enum PlayerStoryStopOp {
    END = 1;
    SKIP = 2;
}
enum MatchStatusSyncReason {
    MSSR_NONE = 0;
    MSSR_OVERTIME = 1;
}
enum TeamDismissReason {
    TDR_NONE = 0;
    TDR_OVERTIME = 1;
}
message CampaignSceneData {
    optional uint32 scene_id = 1;
    optional CampaignSceneStatusType scene_status = 2;
    repeated uint32 win_values = 3;
    optional uint32 cur_step = 4;
    repeated WorldObj objs = 5;
}
message CampaignInfo {
    optional uint32 start_time = 1;
    repeated uint32 star_values = 2;
    optional CampaignStatusType status = 3;
    optional uint32 star = 4;
    repeated uint32 win_values = 5;
    repeated uint32 lose_values = 6;
    optional uint32 cur_scene_id = 7;
    optional uint32 end_time = 8;
    optional uint32 dungeon_id = 9;
    optional uint32 dungeon_instance_id = 10;
    repeated CampaignSceneData scene_datas = 11;
    optional uint32 real_start_time = 12;
    optional uint32 score = 13;
    optional uint64 total_elapse_time = 14;
    optional uint64 cache_real_start_time = 15;
}
message SequenceU32 {
    optional uint32 index = 1;
    optional uint32 value = 2;
}
message InstanceInfo {
    optional uint32 ins_id = 1;
    optional uint32 ins_star = 2;
    optional uint64 success_time = 3;
}
message StaminaBox {
    optional uint32 box_id = 1;
    optional uint32 up_count = 2;
    optional uint32 up_time = 3;
    optional uint32 finish_time = 4;
    optional uint32 box_count = 5;
    optional uint32 box_count_time = 7;
    optional uint32 total_pause_time = 8;
}
message SCInstanceInfoSync {
    repeated InstanceInfo infos = 1;
}
message SCStaminaBoxSync {
    repeated StaminaBox boxes = 1;
}
message CSCampaignStart {
    optional uint32 group_id = 1;
    optional uint32 difficulty = 2;
}
